# Reproducibility checklist (SCOPE.md §6). Used by the M6 analyzer in Phase 3.
# rule: name of a deterministic check in backend/app/pipeline/repro/rules.py (null = LLM only).
# Weights are relative; groups Code and Experimental setup weigh most.
version: 1
groups:
  code: { label: Code, weight: 0.25 }
  data: { label: Data, weight: 0.20 }
  setup: { label: Experimental setup, weight: 0.25 }
  compute: { label: Compute, weight: 0.10 }
  stats: { label: Statistical reporting, weight: 0.20 }

items:
  - { id: code_url, group: code, weight: 2, rule: code_url_present, description: "The paper links to source code." }
  - { id: repo_reachable, group: code, weight: 1, rule: repo_reachable, description: "The linked repository exists and can be cloned." }
  - { id: license, group: code, weight: 1, rule: repo_license, description: "The repository has an open-source license." }
  - { id: dependency_file, group: code, weight: 1, rule: repo_dependency_file, description: "The repository lists dependencies (requirements.txt, environment.yml, pyproject.toml, Dockerfile)." }
  - { id: run_instructions, group: code, weight: 1, rule: repo_run_instructions, description: "The README explains how to train and evaluate." }
  - { id: pretrained_weights, group: code, weight: 1, rule: null, description: "Trained model weights or checkpoints are released." }

  - { id: datasets_named, group: data, weight: 2, rule: null, description: "Every dataset used is named." }
  - { id: datasets_access, group: data, weight: 1, rule: dataset_links, description: "Datasets are public, or access to them is described." }
  - { id: preprocessing, group: data, weight: 1, rule: null, description: "Data preprocessing and filtering steps are described." }
  - { id: splits, group: data, weight: 1, rule: null, description: "Train / validation / test splits are specified." }

  - { id: hyperparameters_all, group: setup, weight: 2, rule: null, description: "Hyperparameters are given for the proposed method and the baselines." }
  - { id: hp_search, group: setup, weight: 1, rule: null, description: "The hyperparameter search (ranges, method, budget) is described." }
  - { id: training_details, group: setup, weight: 1, rule: training_terms, description: "Optimizer, learning-rate schedule and number of epochs or steps are stated." }
  - { id: eval_protocol, group: setup, weight: 1, rule: null, description: "The evaluation protocol and metrics are defined." }

  - { id: hardware, group: compute, weight: 1, rule: gpu_models, description: "The hardware used (GPU/TPU type and count) is stated." }
  - { id: training_time, group: compute, weight: 1, rule: compute_hours, description: "Training time or GPU hours are reported." }
  - { id: memory, group: compute, weight: 1, rule: null, description: "Memory requirements are reported." }

  - { id: runs_seeds, group: stats, weight: 1, rule: seed_terms, description: "The number of runs or random seeds is reported." }
  - { id: error_bars, group: stats, weight: 1, rule: error_bars, description: "Results include error bars, standard deviations or confidence intervals." }
  - { id: significance, group: stats, weight: 1, rule: null, description: "Statistical significance testing is reported." }
  - { id: baselines_rerun, group: stats, weight: 1, rule: null, description: "The paper states whether baseline numbers were re-run or copied from prior work." }
