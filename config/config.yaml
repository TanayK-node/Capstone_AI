# PaperLens runtime configuration.
# Every model name, rate limit and feature flag lives here (CLAUDE.md rule 1).
# Any key can be overridden by an env var: PAPERLENS_<SECTION>__<KEY>, e.g.
#   PAPERLENS_LLM__PRIMARY=ollama
#   PAPERLENS_LLM__GEMINI__MODELS__EXTRACTION=gemini-2.5-flash
# Secrets (GEMINI_API_KEY, GITHUB_TOKEN) come from the environment / .env only.

app:
  env: dev
  log_level: INFO
  data_dir: ./data            # uploaded PDFs, parser outputs

database_url: postgresql+psycopg://paperlens:paperlens@localhost:5432/paperlens
redis_url: redis://localhost:6379/0
grobid_url: http://localhost:8070

llm:
  # Provider tried first. The project runs on Gemini only; "ollama" is kept as an option.
  primary: gemini
  # Provider used when the primary keeps failing (429s, quota, outage). null = no fallback.
  # Set to "ollama" to re-enable the local Qwen fallback.
  fallback: null
  # Consecutive failed calls on the primary before switching every call to the fallback.
  fallback_after_failures: 3
  # How long to stay on the fallback before trying the primary again.
  fallback_cooldown_s: 300
  request_timeout_s: 120
  # Bump to invalidate every cached LLM response at once.
  cache_version: 1

  retry:
    max_attempts: 5           # per model, for 429 / 5xx / timeouts (waits 2+4+8+16 s)
    base_delay_s: 2.0
    max_delay_s: 45.0
    jitter: 0.5               # +/- fraction of the delay

  gemini:
    # Roles map pipeline needs to concrete model IDs. Check the current free-tier lineup
    # with `uv run python -m app.llm.check --list-models` and update here, never in code.
    # Oct 2026: the 2.5 models return 404 for new API keys; Google's error names
    # gemini-3.5-flash-lite as the replacement.
    # Extraction runs on Flash-Lite too: Flash's free-tier daily limit (~250 requests) is too
    # small for ~6 calls per paper; Lite allows ~1000/day. Flash is kept as the backup below.
    models:
      extraction: gemini-3.5-flash-lite
      small: gemini-3.5-flash-lite
      vision: gemini-3.5-flash
    # Free-tier limits per model. These change without notice: re-check Google's
    # rate-limit page and set them a little below the published numbers.
    rate_limits:
      gemini-3.5-flash:      { rpm: 9,  rpd: 240 }
      gemini-3.5-flash-lite: { rpm: 14, rpd: 950 }
    default_rate_limit: { rpm: 5, rpd: 100 }
    # When a model stays overloaded after every retry (HTTP 503 "high demand", common on the
    # free tier) or its daily quota is spent, the call is tried once on this backup model.
    # The model that answered is logged and stored with the result (CLAUDE.md rule 8).
    # Flash is only used here, so its small daily quota is rarely touched.
    overload_fallback:
      gemini-3.5-flash-lite: gemini-3.5-flash

  ollama:
    base_url: http://localhost:11434
    models:
      extraction: qwen3:8b
      small: qwen3:4b
      vision: qwen2.5vl:7b
    # Local models have no quota; the limiter only stops us flooding the laptop.
    rate_limits: {}
    default_rate_limit: { rpm: 60, rpd: null }
    num_ctx: 8192             # matches the <= 8k token section-group budget

  # Thinking off for extraction; turned on per call for claims and critique.
  thinking_default: false

ingest:
  max_mb: 50
  max_pages: 100
  allow_scanned: false        # PDFs without a text layer are rejected (OCR is a non-goal)
  fetch_latex_source: true    # store arXiv LaTeX sources for later table/equation alignment
  download_timeout_s: 60
  # Unpaywall (open-access PDFs for DOIs) requires a contact email; DOI lookups without it
  # fall back to Semantic Scholar only. Set PAPERLENS_INGEST__CONTACT_EMAIL in .env.
  contact_email: null

parsing:
  parser: auto                # auto = GROBID, falling back to PyMuPDF if GROBID is down
  grobid_timeout_s: 180

pipeline:
  # true = run stages in the API process (no Redis/Celery needed); handy on Windows.
  # Either way papers are processed one at a time, in upload order.
  eager: false

extraction:
  # Characters of paper text per section-group call (~4 chars per token). Gemini Flash
  # takes far more; this keeps calls fast and the free-tier token budget small.
  max_group_chars: 48000
  # Section-group calls in flight at once (4 groups per paper). 2 roughly halves the time
  # per paper and stays well under the free-tier RPM; set 1 if you keep seeing 503s.
  parallel_calls: 2
  # A group whose call still failed (after the gateway's retries and backup model) is
  # re-tried once after this pause, so a short demand spike does not lose a section.
  retry_failed_after_s: 20

repro:
  # Code items (repo reachable, license, dependency file, run instructions, weights) read the
  # GitHub REST API: metadata, root file list and README. Nothing is cloned or executed.
  # Unauthenticated: 60 requests/hour (3 per paper); set GITHUB_TOKEN in .env for 5000.
  github_check: true
  github_timeout_s: 15
  # Paper text (experiments, tables, appendix) sent with the one checklist LLM call.
  max_context_chars: 48000

claims:
  # Claims are checked against the results tables in Python. A recomputed value or delta
  # within this absolute tolerance of the claimed one counts as supported (SCOPE.md F8).
  tolerance: 0.15

code_check:
  # Paper-code consistency (M7). Repositories are shallow-cloned with git hooks off and
  # scanned statically; nothing from them is ever run (CLAUDE.md rule 6).
  # sandbox: docker = the paperlens-sandbox image, no network, read-only
  #          (build it once: docker build -t paperlens-sandbox sandbox/)
  #          process = a separate, resource-limited Python process (used inside compose,
  #          where the worker cannot start containers)
  #          auto = docker when the image exists, else process
  sandbox: auto
  clone_timeout_s: 60
  max_repo_mb: 200
  # Search GitHub by title when the paper links no repository (needs confirmation).
  search_github: true

embeddings:
  # Local passage embeddings for chat retrieval (M11), run with fastembed (ONNX, no PyTorch).
  # The model downloads once from Hugging Face into <data_dir>/models (~130 MB).
  # enabled: false = keyword (BM25) search only.
  enabled: true
  model: BAAI/bge-small-en-v1.5
  device: cpu

chat:
  top_k: 5            # passages sent to Gemini with a question
  candidates: 20      # per retriever (BM25, embeddings) before fusing the two rankings
  min_cosine: 0.45    # no shared word and nothing this close in meaning: "not in the paper"
  history_turns: 4    # earlier turns sent along with a follow-up question

context:
  # Citation graph and novelty positioning (M12). Semantic Scholar's Graph API gives
  # references, citing papers and abstracts; S2_API_KEY in .env is optional (without it the
  # shared, often busy pool is used). Unreachable: the graph is built from the paper's own
  # reference list and in-text citations, and there is no novelty summary.
  semantic_scholar: true
  timeout_s: 20
  retries: 5            # on "busy" (HTTP 429): waits 2, 4, 8, 16, 30 s
  min_interval_s: 1.1   # between requests; the keyless pool allows about 1 per second
  top_references: 20
  top_citations: 20
  citations_fetched: 1000
  novelty_references: 10

features:
  latex_source: true
  code_check: true
  claims: true
  chat: true
  citation_graph: true
  chart_to_data: false        # Tier 3 stretch
