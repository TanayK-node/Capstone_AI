[project]
name = "paperlens-backend"
version = "0.1.0"
description = "PaperLens API, worker pipeline and LLM gateway"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "celery>=5.4",
    "redis>=5.0",
    "httpx>=0.27",
    "google-genai>=1.0",
    "pymupdf>=2.0",
    "lxml>=6.1.3",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
    "types-lxml>=2026.2.16",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/fixtures/make_fixtures.py" = ["E501"]  # HTML fixture content
"app/pipeline/parse/tables.py" = ["RUF001", "RUF002", "RUF003"]  # matches unicode dashes/signs
"app/pipeline/verify/grounding.py" = ["RUF001", "RUF002", "RUF003"]
"app/pipeline/extract/normalize.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
# The migrations folder is named alembic/; make sure the library still sorts as third-party.
known-third-party = ["alembic"]
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyMuPDF's API is only partly annotated.
module = ["app.pipeline.parse.*", "app.pipeline.verify.*", "app.pipeline.ingest.validate", "tests.*"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["app.workers.*"]
disallow_untyped_decorators = false  # Celery's task decorator is untyped

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls real LLM providers (needs GEMINI_API_KEY and/or a running Ollama); run with -m live",
]
addopts = "-m 'not live'"
